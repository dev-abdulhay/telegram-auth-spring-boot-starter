name: Release to Maven Central

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Override version (optional; default uses pom.xml)'
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Use workflow-dispatch version
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        run: echo "RELEASE_VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"

      # Note: we deliberately don't pass server-id/server-username/server-password
      # to setup-java. setup-java generates a settings.xml with
      # ${env.SONATYPE_USERNAME} placeholders that are sometimes not resolved at
      # runtime by central-publishing-maven-plugin, which then sends literal
      # placeholder strings as credentials and gets a 401 from Sonatype. We
      # write a fully-resolved settings.xml ourselves below.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          gpg-private-key: ${{ secrets.SIGNING_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Write ~/.m2/settings.xml with Sonatype credentials
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: |
          mkdir -p ~/.m2
          # Use a heredoc and parameter expansion (not GitHub template syntax)
          # so the secret values are not echoed in the workflow log.
          cat > ~/.m2/settings.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>central</id>
                <username>${SONATYPE_USERNAME}</username>
                <password>${SONATYPE_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Align pom.xml version with release tag
        if: env.RELEASE_VERSION != ''
        run: |
          mvn -B -ntp versions:set -DnewVersion="${RELEASE_VERSION}" -DgenerateBackupPoms=false

      - name: Diagnostic — verify Sonatype credentials reach runner intact
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: |
          echo "username length: ${#SONATYPE_USERNAME}"
          echo "password length: ${#SONATYPE_PASSWORD}"
          # Verify settings.xml was written and contains a non-empty username
          if [ -f ~/.m2/settings.xml ]; then
            sm_user_len=$(awk -F'[<>]' '/<username>/{print length($3)}' ~/.m2/settings.xml)
            sm_pass_len=$(awk -F'[<>]' '/<password>/{print length($3)}' ~/.m2/settings.xml)
            echo "settings.xml username length: ${sm_user_len}"
            echo "settings.xml password length: ${sm_pass_len}"
          else
            echo "settings.xml not found"
          fi
          # Test the upload endpoint directly with the same auth header that
          # central-publishing-maven-plugin would send. We don't actually need
          # to upload anything valid — we just want to see whether Sonatype
          # rejects auth (401) or accepts auth and rejects the bundle (4xx).
          TOKEN=$(printf '%s:%s' "$SONATYPE_USERNAME" "$SONATYPE_PASSWORD" | base64 -w0 2>/dev/null || printf '%s:%s' "$SONATYPE_USERNAME" "$SONATYPE_PASSWORD" | base64)
          echo "base64 token length: ${#TOKEN}"
          echo "dummy" > /tmp/dummy.zip
          HTTP_CODE=$(curl -sS -o /tmp/resp.txt -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -F "bundle=@/tmp/dummy.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload" || echo "curl-failed")
          echo "Sonatype upload endpoint HTTP code: $HTTP_CODE"
          echo "--- response body (first 300 chars) ---"
          head -c 300 /tmp/resp.txt || true
          rm -f /tmp/dummy.zip /tmp/resp.txt

      - name: Maven deploy (sign + publish to Sonatype Central Portal)
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.SIGNING_PASSWORD }}
        run: mvn -B -ntp -Prelease deploy
